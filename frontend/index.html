<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legis — Asistente Laboral</title>
  <meta name="description" content="Asistente legal con IA para despachos laboralistas en México. El precedente exacto, en segundos.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <style>
    /* === Reset y base === */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1a1a1a;
      background: #FFFFFF;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: #185FA5; }
    code { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 0.9em; }

    /* === Layout principal — full viewport === */
    .legis-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .legis-sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #F5F5F7;
      padding: 1.5rem 1.25rem;
      border-right: 1px solid #e3e6eb;
      overflow-y: auto;
      height: 100vh;
    }
    .legis-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      height: 100vh;
      overflow: hidden;
    }

    /* === Sidebar: logo === */
    .legis-logo {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .legis-logo-icon {
      font-size: 1.95rem;
      line-height: 1;
      color: #185FA5;
    }
    .legis-logo-name {
      font-size: 1.55rem;
      font-weight: 700;
      color: #0C447C;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .legis-tagline {
      font-size: 0.82rem;
      color: #5b6470;
      margin: 0.35rem 0 1.4rem 0;
    }

    .legis-section-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #5b6470;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 1.2rem 0 0.55rem 0;
    }

    /* === Stats: lista vertical === */
    .legis-stats {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .legis-stat {
      background: white;
      border: 1px solid #e3e6eb;
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .legis-stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #185FA5;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      min-width: 2.5ch;
      text-align: right;
      flex-shrink: 0;
    }
    .legis-stat-label {
      font-size: 0.78rem;
      color: #2a3340;
      line-height: 1.3;
    }
    .legis-stat-placeholder { color: #b5bdc7 !important; }

    /* === Lista de fuentes activas === */
    .legis-sources-list { margin-top: 0.3rem; }
    .legis-source-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.3rem 0;
      font-size: 0.85rem;
      color: #2a3340;
      line-height: 1.35;
    }
    .legis-source-check {
      color: #22a06b;
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
      width: 1rem;
      text-align: center;
    }
    .legis-update-info {
      margin-top: 0.7rem;
      padding-top: 0.7rem;
      border-top: 1px solid #e3e6eb;
      font-size: 0.75rem;
      color: #5b6470;
      font-style: italic;
    }

    /* === Historial de conversaciones === */
    .legis-history-new {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: white;
      border: 1px solid #c9deef;
      border-radius: 6px;
      color: #185FA5;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.55rem 0.75rem;
      margin: 0 0 0.6rem 0;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .legis-history-new:hover {
      background: #E6F1FB;
      border-color: #185FA5;
    }
    .legis-history-empty {
      font-size: 0.75rem;
      color: #9ca3af;
      font-style: italic;
      padding: 0.4rem 0;
      text-align: center;
    }
    .legis-history-list {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      max-height: 280px;
      overflow-y: auto;
    }
    .legis-history-item {
      display: flex;
      align-items: stretch;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .legis-history-item:hover { background: #ebeef2; }
    .legis-history-item.active { background: #E6F1FB; }
    .legis-history-item.active .legis-history-preview {
      color: #0C447C;
      font-weight: 500;
    }
    .legis-history-text {
      flex: 1;
      background: none;
      border: none;
      text-align: left;
      padding: 0.5rem 0.4rem 0.5rem 0.6rem;
      font-family: inherit;
      cursor: pointer;
      color: inherit;
      min-width: 0;
    }
    .legis-history-preview {
      font-size: 0.82rem;
      color: #2a3340;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .legis-history-date {
      font-size: 0.7rem;
      color: #9ca3af;
      margin-top: 0.18rem;
    }
    .legis-history-delete {
      background: none;
      border: none;
      color: #9ca3af;
      padding: 0 0.55rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-radius: 0 6px 6px 0;
      transition: color 0.15s, background 0.15s;
      opacity: 0;
      flex-shrink: 0;
    }
    .legis-history-item:hover .legis-history-delete,
    .legis-history-item.active .legis-history-delete {
      opacity: 1;
    }
    .legis-history-delete:hover {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.08);
    }

    /* === Caja advertencia ámbar === */
    .legis-warning {
      background: #FAEEDA;
      color: #633806;
      padding: 0.8rem 0.9rem;
      border-radius: 6px;
      font-size: 0.76rem;
      line-height: 1.48;
      border-left: 3px solid #b45309;
      margin-top: 1.6rem;
    }
    .legis-warning-title {
      font-weight: 700;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.7rem;
    }

    /* === Welcome state (sin respuesta): centrado vertical === */
    .legis-welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }
    .legis-welcome-title {
      font-size: 2rem;
      font-weight: 600;
      color: #0C447C;
      text-align: center;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.01em;
    }
    .legis-welcome-subtitle {
      font-size: 1rem;
      color: #5b6470;
      text-align: center;
      margin: 0 0 2.25rem 0;
    }

    /* === Conversation state: scroll área arriba + input fijo abajo === */
    .legis-conversation {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .legis-conversation-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* === Input bar — común a ambos modos === */
    .legis-input-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .legis-input-bar.bottom {
      border-top: 1px solid #e6edf5;
      padding: 1rem 1.5rem 1.5rem 1.5rem;
      background: white;
    }
    .legis-input-bar.centered {
      padding: 0;
    }
    .legis-input-wrapper {
      position: relative;
      max-width: 760px;
      width: 100%;
    }
    .legis-input-textarea {
      width: 100%;
      padding: 1.05rem 3.75rem 1.05rem 1.35rem;
      border-radius: 24px;
      border: 1px solid #d4dce5;
      box-shadow: 0 2px 12px rgba(15, 30, 60, 0.06);
      resize: none;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.5;
      min-height: 56px;
      max-height: 200px;
      outline: none;
      transition: box-shadow 0.18s, border-color 0.18s;
      color: #1a1a1a;
      background: white;
      overflow-y: hidden;
    }
    .legis-input-textarea:focus {
      box-shadow: 0 4px 18px rgba(24, 95, 165, 0.16);
      border-color: #c9deef;
    }
    .legis-input-textarea:disabled {
      background: #f8f9fa;
      color: #6b7280;
      cursor: not-allowed;
    }
    .legis-input-textarea::placeholder { color: #9ca3af; }

    .legis-input-send {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 19px;
      background: #185FA5;
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.08s;
    }
    .legis-input-send:hover:not(:disabled) { background: #0C447C; }
    .legis-input-send:active:not(:disabled) { transform: translateY(-50%) scale(0.93); }
    .legis-input-send:disabled { background: #c9ced6; cursor: not-allowed; }
    .legis-input-send svg { display: block; }

    .legis-input-hint {
      margin-top: 0.55rem;
      font-size: 0.72rem;
      color: #9ca3af;
      text-align: center;
    }

    /* === Chips centrados debajo del input en welcome === */
    .legis-chips-centered {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      margin-top: 1.4rem;
      max-width: 760px;
      width: 100%;
    }
    .legis-chip {
      background: white;
      color: #0C447C;
      border: 1px solid #c9deef;
      border-radius: 999px;
      padding: 0.42rem 1rem;
      font-size: 0.84rem;
      font-weight: 500;
      transition: all 0.15s ease;
      line-height: 1.3;
    }
    .legis-chip:hover {
      background: #E6F1FB;
      border-color: #185FA5;
    }
    .legis-chip:focus-visible {
      outline: 2px solid #185FA5;
      outline-offset: 2px;
    }
    .legis-chip:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* === User bubble (consulta del usuario) === */
    .legis-turn {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .legis-user-bubble {
      align-self: flex-end;
      max-width: 78%;
      background: #185FA5;
      color: white;
      padding: 0.75rem 1.15rem;
      border-radius: 18px;
      border-bottom-right-radius: 5px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    /* === Loading turn === */
    .legis-loading-card {
      background: white;
      border: 1px solid #e6edf5;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      color: #5b6470;
      font-size: 0.92rem;
      align-self: stretch;
    }
    .legis-spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #c9deef;
      border-top-color: #185FA5;
      border-radius: 50%;
      animation: legis-spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes legis-spin { to { transform: rotate(360deg); } }

    /* === Error turn === */
    .legis-error-card {
      background: #FEE2E2;
      border: 1px solid #fecaca;
      border-left: 3px solid #dc2626;
      border-radius: 8px;
      padding: 0.95rem 1.2rem;
      color: #991B1B;
      font-size: 0.92rem;
      line-height: 1.5;
      align-self: stretch;
    }
    .legis-error-card code {
      background: rgba(0,0,0,0.06);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    /* === Card de la respuesta — max 760px === */
    .legis-answer-card {
      background: white;
      border: 1px solid #e6edf5;
      border-radius: 12px;
      padding: 1.85rem 2rem;
      box-shadow: 0 1px 3px rgba(15, 30, 60, 0.04);
      font-size: 16px;
      line-height: 1.65;
      color: #1f2937;
      align-self: stretch;
    }
    .legis-answer-card h2 {
      color: #0C447C;
      font-size: 1.18rem;
      font-weight: 700;
      margin: 1.6rem 0 0.6rem 0;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid #f0f4f8;
      letter-spacing: -0.005em;
    }
    .legis-answer-card h2:first-child,
    .legis-answer-card > *:first-child + h2 { margin-top: 0; }
    .legis-answer-card h3 {
      color: #185FA5;
      font-size: 1.02rem;
      font-weight: 600;
      margin: 1.1rem 0 0.45rem 0;
    }
    .legis-answer-card p {
      margin: 0.85rem 0;
      font-size: 16px;
      line-height: 1.7;
    }
    .legis-answer-card ul, .legis-answer-card ol {
      padding-left: 1.5rem;
      margin: 0.75rem 0;
    }
    .legis-answer-card li {
      margin: 0.45rem 0;
      font-size: 16px;
      line-height: 1.65;
    }
    .legis-answer-card strong { font-weight: 600; color: #0C447C; }
    .legis-answer-card hr {
      border: none;
      border-top: 1px solid #f0f4f8;
      margin: 1.3rem 0;
    }

    /* === Confianza inline: barra compacta dentro de la respuesta === */
    .legis-confidence-inline {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.15rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f0f4f8;
      flex-wrap: wrap;
    }
    .legis-conf-inline-label {
      font-size: 0.7rem;
      color: #5b6470;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .legis-conf-inline-bar {
      flex: 1;
      min-width: 100px;
      max-width: 220px;
      height: 6px;
      background: #e6edf5;
      border-radius: 3px;
      overflow: hidden;
    }
    .legis-conf-inline-fill {
      height: 100%;
      background: #185FA5;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .legis-conf-inline-badge {
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .legis-conf-inline-badge.alta { background: #EAF3DE; color: #27500A; }
    .legis-conf-inline-badge.media { background: #FEF3C7; color: #92400E; }
    .legis-conf-inline-badge.baja { background: #FEE2E2; color: #991B1B; }
    .legis-conf-inline-pct {
      font-size: 0.78rem;
      color: #5b6470;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* === Citación inline === */
    .legis-cite {
      background: #E6F1FB;
      color: #0C447C;
      padding: 0.18rem 0.6rem;
      border-radius: 5px;
      font-size: 0.92em;
      font-weight: 500;
      border: 1px solid #c9deef;
      white-space: nowrap;
      margin: 0 2px;
      display: inline-block;
      line-height: 1.4;
    }

    /* === Acordeón de fuentes === */
    .legis-sources-accordion {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #f0f4f8;
    }
    .legis-accordion-toggle {
      background: none;
      border: none;
      padding: 0.4rem 0;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: #185FA5;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
      transition: color 0.15s;
    }
    .legis-accordion-toggle:hover { color: #0C447C; }
    .legis-accordion-toggle svg {
      transition: transform 0.2s ease;
    }
    .legis-accordion-toggle.open svg { transform: rotate(90deg); }
    .legis-accordion-content {
      margin-top: 0.95rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    @media (max-width: 600px) {
      .legis-accordion-content { grid-template-columns: 1fr; }
    }

    /* Source card dentro del acordeón */
    .legis-source-card {
      background: #fafbfc;
      border: 1px solid #e6edf5;
      border-radius: 8px;
      padding: 0.85rem 1rem;
    }
    .legis-source-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }
    .legis-source-cite {
      color: #0C447C;
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-word;
      line-height: 1.35;
    }
    .legis-badge {
      padding: 0.14rem 0.55rem;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .legis-badge.obligatoria { background: #EAF3DE; color: #27500A; }
    .legis-badge.orientadora { background: #FEF3C7; color: #92400E; }
    .legis-source-meta {
      font-size: 0.78rem;
      color: #5b6470;
      line-height: 1.5;
    }
    .legis-source-meta .pipe {
      margin: 0 0.4rem;
      color: #c9ced6;
    }
    .legis-source-relevance {
      margin-top: 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .legis-source-relevance-label {
      font-size: 0.65rem;
      color: #5b6470;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      flex-shrink: 0;
    }
    .legis-source-relevance-bar {
      flex: 1;
      height: 4px;
      background: #e3e6eb;
      border-radius: 2px;
      overflow: hidden;
    }
    .legis-source-relevance-fill {
      height: 100%;
      background: #185FA5;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .legis-layout {
        flex-direction: column;
        height: auto;
        overflow: visible;
      }
      .legis-sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #e3e6eb;
        padding: 1.25rem;
      }
      .legis-main { height: auto; }
      .legis-conversation { padding: 1.25rem; }
      .legis-answer-card { padding: 1.5rem 1.4rem; }
      .legis-welcome-title { font-size: 1.55rem; }
      .legis-input-bar.bottom { padding: 0.8rem 1rem 1rem 1rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.5/babel.min.js"></script>
  <script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>

  <script type="text/babel">
    "use strict";

    const { useState, useEffect, useCallback, useRef, useLayoutEffect } = React;

    // === Constantes ===

    const EXAMPLE_CHIPS = [
      "¿Cómo calcular la liquidación?",
      "¿Procede la reinstalación?",
      "Contratos por tiempo determinado",
      "Límite de horas extra",
      "Despido injustificado outsourcing",
    ];

    const DOC_TYPE_ES = {
      ley_federal: "ley federal",
      constitucion: "constitución",
      jurisprudencia: "jurisprudencia",
      tesis: "tesis aislada",
      criterio_imss: "criterio IMSS",
      laudo: "laudo",
    };

    const VIGENCIA_ANYO = new Date().getFullYear();
    const TODAY_ES = new Date().toLocaleDateString("es-MX", {
      day: "numeric",
      month: "long",
      year: "numeric",
    });

    const CITATION_REGEX = /\[(?:LFT|LSS|LFTSE|LINFONAVIT|CPEUM|SCJN|IMSS|STPS)\b[^\]]*\]/g;

    const HISTORY_STORAGE_KEY = "legis_history_v1";
    const HISTORY_MAX = 20;
    const QUERY_PREVIEW_MAX = 40;

    // === Helpers ===

    function confidenceDescriptor(value) {
      if (value >= 0.95) return { label: "Alta", cssClass: "alta" };
      if (value >= 0.5) return { label: "Media", cssClass: "media" };
      return { label: "Baja", cssClass: "baja" };
    }

    function scoreToPercent(score) {
      if (typeof score !== "number" || isNaN(score)) return 0;
      const sig = 1 / (1 + Math.exp(-score));
      return Math.round(sig * 100);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function renderAnswerHtml(markdownText) {
      const html = marked.parse(markdownText || "", { breaks: true, gfm: true });
      return html.replace(CITATION_REGEX, (match) =>
        `<span class="legis-cite">${escapeHtml(match)}</span>`
      );
    }

    function formatSourcesList(stats) {
      if (!stats || !Array.isArray(stats.sources)) return [];
      const set = new Set(stats.sources);
      const items = [];
      if (set.has("LFT")) items.push(`Ley Federal del Trabajo (${VIGENCIA_ANYO})`);
      if (set.has("CPEUM")) items.push("Constitución — Art. 123");
      if (set.has("LSS")) items.push(`Ley del Seguro Social (${VIGENCIA_ANYO})`);
      if (set.has("LFTSE")) items.push(`LFTSE (${VIGENCIA_ANYO})`);
      if (set.has("LINFONAVIT")) items.push(`Ley del INFONAVIT (${VIGENCIA_ANYO})`);
      if (set.has("IMSS")) items.push(`Criterios normativos IMSS (${VIGENCIA_ANYO})`);
      if (set.has("SCJN")) {
        const total = (stats.juris || 0) + (stats.tesis || 0);
        items.push(`${total.toLocaleString("es-MX")} tesis laborales SCJN`);
      }
      if (set.has("STPS")) items.push("Normativa STPS");
      return items;
    }

    /**
     * Formato compacto para fechas del historial:
     *   Hoy        → "14:32"
     *   Ayer       → "Ayer"
     *   Esta semana → "Hace N días"
     *   Mismo año  → "12 may"
     *   Otro año   → "12 may 2024"
     */
    function formatDateShort(timestamp) {
      if (!timestamp) return "";
      const date = new Date(timestamp);
      const now = new Date();
      if (date.toDateString() === now.toDateString()) {
        return date.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMs = now.getTime() - date.getTime();
      const diffDays = Math.floor(diffMs / 86400000);
      if (diffDays === 1) return "Ayer";
      if (diffDays > 1 && diffDays < 7) return `Hace ${diffDays} días`;
      if (date.getFullYear() === now.getFullYear()) {
        return date.toLocaleDateString("es-MX", { day: "numeric", month: "short" });
      }
      return date.toLocaleDateString("es-MX", {
        day: "numeric", month: "short", year: "numeric",
      });
    }

    function previewQuery(text) {
      if (!text) return "";
      const t = text.trim();
      return t.length > QUERY_PREVIEW_MAX
        ? t.substring(0, QUERY_PREVIEW_MAX).trim() + "…"
        : t;
    }

    /** Carga el historial de localStorage, tolerante a corrupción/vacío. */
    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.warn("No se pudo cargar el historial:", e);
        return [];
      }
    }

    /** Persiste el historial; silencioso si localStorage no está disponible. */
    function saveHistory(history) {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
      } catch (e) {
        console.warn("No se pudo guardar el historial:", e);
      }
    }

    async function fetchJson(url, options) {
      const resp = await fetch(url, options);
      const text = await resp.text();
      let body;
      try { body = text ? JSON.parse(text) : {}; }
      catch (e) { body = { detail: text || "Respuesta no parseable" }; }
      if (!resp.ok) {
        const err = new Error(body.detail || `HTTP ${resp.status}`);
        err.status = resp.status;
        err.body = body;
        throw err;
      }
      return body;
    }

    // === Iconos SVG inline ===

    function SendIcon() {
      return (
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      );
    }

    function ChevronIcon() {
      return (
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 6l6 6-6 6" />
        </svg>
      );
    }

    function PlusIcon() {
      return (
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      );
    }

    function TrashIcon() {
      return (
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      );
    }

    // === Componentes del historial ===

    function HistoryItem({ item, active, onLoad, onDelete }) {
      return (
        <div className={`legis-history-item${active ? " active" : ""}`}>
          <button
            type="button"
            className="legis-history-text"
            onClick={onLoad}
            title={item.query}
          >
            <div className="legis-history-preview">{previewQuery(item.query)}</div>
            <div className="legis-history-date">{formatDateShort(item.timestamp)}</div>
          </button>
          <button
            type="button"
            className="legis-history-delete"
            onClick={(e) => { e.stopPropagation(); onDelete(); }}
            title="Eliminar conversación"
            aria-label="Eliminar conversación"
          >
            <TrashIcon />
          </button>
        </div>
      );
    }

    function HistorySection({ history, activeId, onNewConv, onLoadConv, onDeleteConv }) {
      return (
        <>
          <div className="legis-section-title">Conversaciones anteriores</div>
          <button
            type="button"
            className="legis-history-new"
            onClick={onNewConv}
          >
            <PlusIcon /> Nueva consulta
          </button>
          {history.length === 0 ? (
            <div className="legis-history-empty">Sin conversaciones aún</div>
          ) : (
            <div className="legis-history-list">
              {history.map((item) => (
                <HistoryItem
                  key={item.id}
                  item={item}
                  active={item.id === activeId}
                  onLoad={() => onLoadConv(item)}
                  onDelete={() => onDeleteConv(item.id)}
                />
              ))}
            </div>
          )}
        </>
      );
    }

    // === Sidebar (sin cambios respecto a la versión anterior) ===

    function Sidebar({
      stats, history, activeId,
      onNewConv, onLoadConv, onDeleteConv,
    }) {
      const loaded = stats != null;
      const empty = loaded && stats.chunks === 0;
      const showValues = loaded && !empty;

      const leyesCount = showValues
        ? Math.max(0, (stats.documents || 0) - (stats.juris || 0) - (stats.tesis || 0))
        : null;
      const sourceItems = showValues ? formatSourcesList(stats) : [];

      return (
        <aside className="legis-sidebar">
          <div className="legis-logo">
            <span className="legis-logo-icon" aria-hidden="true">⚖</span>
            <span className="legis-logo-name">Legis</span>
          </div>
          <div className="legis-tagline">El precedente exacto, en segundos.</div>

          <div className="legis-section-title">Corpus indexado</div>
          <div className="legis-stats">
            <StatCard value={leyesCount} label="Leyes indexadas" />
            <StatCard value={showValues ? stats.juris : null} label="Jurisprudencias obligatorias" />
            <StatCard value={showValues ? stats.tesis : null} label="Tesis de apoyo" />
          </div>
          {empty && (
            <div style={{ marginTop: "0.5rem", fontSize: "0.78rem", color: "#5b6470" }}>
              Corpus aún no indexado.
            </div>
          )}

          {showValues && sourceItems.length > 0 && (
            <>
              <div className="legis-section-title">Fuentes activas</div>
              <div className="legis-sources-list">
                {sourceItems.map((item, i) => (
                  <div key={i} className="legis-source-row">
                    <span className="legis-source-check" aria-hidden="true">✓</span>
                    <span>{item}</span>
                  </div>
                ))}
                <div className="legis-update-info">
                  Última actualización: {TODAY_ES}
                </div>
              </div>
            </>
          )}

          <HistorySection
            history={history}
            activeId={activeId}
            onNewConv={onNewConv}
            onLoadConv={onLoadConv}
            onDeleteConv={onDeleteConv}
          />

          <div className="legis-warning" role="note">
            <div className="legis-warning-title">Advertencia legal</div>
            Las respuestas son orientativas. El criterio jurídico final
            corresponde al abogado responsable del caso. Verifica siempre
            la vigencia de las fuentes citadas.
          </div>
        </aside>
      );
    }

    function StatCard({ value, label }) {
      const isPlaceholder = value == null;
      return (
        <div className="legis-stat">
          <div className={`legis-stat-value${isPlaceholder ? " legis-stat-placeholder" : ""}`}>
            {isPlaceholder ? "—" : value.toLocaleString("es-MX")}
          </div>
          <div className="legis-stat-label">{label}</div>
        </div>
      );
    }

    // === Input (común a welcome y conversation) ===

    function InputBar({ query, onChange, onSubmit, loading, autoFocus }) {
      const ref = useRef(null);

      // Auto-grow del textarea hasta max-height. El scrollbar se oculta
      // mientras el contenido cabe; aparece solo si supera el tope, para
      // que el usuario pueda navegar texto muy largo sin perder visibilidad.
      useLayoutEffect(() => {
        const ta = ref.current;
        if (!ta) return;
        const MAX_H = 200;
        ta.style.height = "auto";
        const fullH = ta.scrollHeight;
        const next = Math.min(fullH, MAX_H);
        ta.style.height = next + "px";
        ta.style.overflowY = fullH > MAX_H ? "auto" : "hidden";
      }, [query]);

      useEffect(() => {
        if (autoFocus && ref.current) ref.current.focus();
      }, [autoFocus]);

      const handleKey = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (!loading && query.trim()) onSubmit();
        }
      };

      const disabled = loading || !query.trim();

      return (
        <div className="legis-input-wrapper">
          <textarea
            ref={ref}
            className="legis-input-textarea"
            placeholder="Pregunta sobre derecho laboral mexicano..."
            value={query}
            onChange={(e) => onChange(e.target.value)}
            onKeyDown={handleKey}
            disabled={loading}
            rows={1}
            aria-label="Tu consulta legal"
          />
          <button
            type="button"
            className="legis-input-send"
            onClick={onSubmit}
            disabled={disabled}
            aria-label="Enviar consulta"
            title="Enviar (Enter)"
          >
            <SendIcon />
          </button>
        </div>
      );
    }

    // === Chips centrados (solo welcome) ===

    function ChipsCentered({ onPick, disabled }) {
      return (
        <div className="legis-chips-centered">
          {EXAMPLE_CHIPS.map((chip, i) => (
            <button
              key={i}
              type="button"
              className="legis-chip"
              onClick={() => onPick(chip)}
              disabled={disabled}
            >
              {chip}
            </button>
          ))}
        </div>
      );
    }

    // === Welcome view (estado vacío) ===

    function WelcomeView({ query, onChange, onSubmit, onChipPick, loading }) {
      return (
        <div className="legis-welcome">
          <h1 className="legis-welcome-title">¿En qué puedo ayudarte hoy?</h1>
          <p className="legis-welcome-subtitle">
            Consulta sobre derecho laboral mexicano
          </p>
          <div className="legis-input-bar centered">
            <InputBar
              query={query}
              onChange={onChange}
              onSubmit={onSubmit}
              loading={loading}
              autoFocus
            />
          </div>
          <ChipsCentered onPick={onChipPick} disabled={loading} />
        </div>
      );
    }

    // === Conversation: turnos ===

    function UserBubble({ text }) {
      return <div className="legis-user-bubble">{text}</div>;
    }

    function LoadingTurn({ isFirst }) {
      return (
        <div className="legis-loading-card" role="status" aria-live="polite">
          <div className="legis-spinner" aria-hidden="true"></div>
          <span>
            {isFirst
              ? "Procesando — la primera vez de la sesión carga los modelos locales (~30s)..."
              : "Procesando consulta..."}
          </span>
        </div>
      );
    }

    function ErrorTurn({ error }) {
      const isCorpusError = error.status === 503;
      return (
        <div className="legis-error-card" role="alert">
          <div>{error.message}</div>
          {isCorpusError && (
            <div style={{ marginTop: "0.5rem" }}>
              Para indexar el corpus, ejecuta en la terminal:{" "}
              <code>python src/ingest.py</code>
            </div>
          )}
        </div>
      );
    }

    function ConfidenceInline({ confidence }) {
      const { label, cssClass } = confidenceDescriptor(confidence);
      const pct = Math.max(2, Math.round(confidence * 100));
      return (
        <div className="legis-confidence-inline">
          <span className="legis-conf-inline-label">Confianza</span>
          <div
            className="legis-conf-inline-bar"
            role="progressbar"
            aria-valuenow={pct}
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label={`Confianza ${label} ${pct}%`}
          >
            <div className="legis-conf-inline-fill" style={{ width: `${pct}%` }}></div>
          </div>
          <span className={`legis-conf-inline-badge ${cssClass}`}>{label}</span>
          <span className="legis-conf-inline-pct">{pct}%</span>
        </div>
      );
    }

    function SourceCard({ source }) {
      const mandatory = !!source.mandatory;
      const badgeClass = mandatory ? "obligatoria" : "orientadora";
      const badgeLabel = mandatory ? "Obligatoria" : "Orientadora";
      const docTypeEs = DOC_TYPE_ES[source.type] || source.type || "—";
      const relevancePct = Math.max(2, scoreToPercent(source.rerank_score));
      return (
        <div className="legis-source-card">
          <div className="legis-source-card-top">
            <span className="legis-source-cite">{source.citation || "[?]"}</span>
            <span className={`legis-badge ${badgeClass}`}>{badgeLabel}</span>
          </div>
          <div className="legis-source-meta">
            {docTypeEs}
            <span className="pipe">·</span>
            página {source.page ?? "?"}
          </div>
          <div className="legis-source-relevance">
            <div className="legis-source-relevance-label">Relevancia</div>
            <div
              className="legis-source-relevance-bar"
              role="progressbar"
              aria-valuenow={relevancePct}
              aria-valuemin="0"
              aria-valuemax="100"
              aria-label={`Relevancia ${relevancePct}%`}
            >
              <div className="legis-source-relevance-fill"
                   style={{ width: `${relevancePct}%` }} />
            </div>
          </div>
        </div>
      );
    }

    function SourcesAccordion({ sources }) {
      const [open, setOpen] = useState(false);
      if (!sources || sources.length === 0) return null;
      return (
        <div className="legis-sources-accordion">
          <button
            type="button"
            className={`legis-accordion-toggle${open ? " open" : ""}`}
            onClick={() => setOpen(!open)}
            aria-expanded={open}
          >
            <ChevronIcon />
            {open ? "Ocultar fuentes" : `Ver fuentes (${sources.length})`}
          </button>
          {open && (
            <div className="legis-accordion-content">
              {sources.map((s, i) => <SourceCard key={i} source={s} />)}
            </div>
          )}
        </div>
      );
    }

    function AnswerTurn({ result }) {
      const conf = result.confidence != null ? result.confidence : 0;
      return (
        <div className="legis-answer-card">
          <ConfidenceInline confidence={conf} />
          <div dangerouslySetInnerHTML={{ __html: renderAnswerHtml(result.answer || "") }} />
          <SourcesAccordion sources={result.sources} />
        </div>
      );
    }

    function Turn({ message, isFirstLoading }) {
      return (
        <div className="legis-turn">
          <UserBubble text={message.query} />
          {message.loading && <LoadingTurn isFirst={isFirstLoading} />}
          {message.error && !message.loading && <ErrorTurn error={message.error} />}
          {message.result && !message.loading && <AnswerTurn result={message.result} />}
        </div>
      );
    }

    function ConversationView({ active, hasHistory }) {
      const bottomRef = useRef(null);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
      }, [active.id, active.loading]);

      // Adapta el objeto `active` al shape que espera Turn.
      const message = {
        query: active.query,
        loading: !!active.loading,
        error: active.error || null,
        result: active.answer != null
          ? {
              answer: active.answer,
              sources: active.sources,
              confidence: active.confidence,
            }
          : null,
      };

      return (
        <div className="legis-conversation">
          <div className="legis-conversation-inner">
            <Turn message={message} isFirstLoading={!hasHistory} />
            <div ref={bottomRef} />
          </div>
        </div>
      );
    }

    // === App raíz ===

    function App() {
      const [stats, setStats] = useState(null);
      const [query, setQuery] = useState("");
      // `active` es la conversación actualmente visible (puede estar loading,
      // tener resultado, o tener error). Null = vista welcome.
      const [active, setActive] = useState(null);
      // `history` se hidrata desde localStorage en la primera evaluación.
      const [history, setHistory] = useState(() => loadHistory());

      // Persistir historial automáticamente en cada cambio.
      useEffect(() => {
        saveHistory(history);
      }, [history]);

      // Stats del corpus (una sola vez al montar).
      useEffect(() => {
        fetchJson("/api/stats")
          .then(setStats)
          .catch((e) => {
            console.error("Error al cargar stats:", e);
            setStats({ chunks: 0, documents: 0, juris: 0, tesis: 0, sources: [] });
          });
      }, []);

      const handleChipPick = useCallback((chip) => {
        setQuery(chip);
      }, []);

      const handleSubmit = useCallback(async () => {
        const trimmed = query.trim();
        if (!trimmed) return;
        if (active && active.loading) return;

        const newId = Date.now();
        const pending = {
          id: newId,
          query: trimmed,
          timestamp: newId,
          loading: true,
        };
        setActive(pending);
        setQuery("");

        try {
          const data = await fetchJson("/api/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: trimmed }),
          });
          const completed = {
            id: newId,
            query: trimmed,
            timestamp: newId,
            answer: data.answer,
            sources: data.sources,
            confidence: data.confidence,
            loading: false,
          };
          // Solo actualiza la vista si el usuario sigue en esta conversación
          // (puede haber cambiado a otra del historial mientras esperábamos).
          setActive((prev) => (prev && prev.id === newId ? completed : prev));
          // El guardado en historial sucede pase lo que pase con la vista —
          // el usuario debe poder recuperarlo desde el sidebar.
          setHistory((prev) => {
            const filtered = prev.filter((c) => c.id !== newId);
            return [completed, ...filtered].slice(0, HISTORY_MAX);
          });
        } catch (e) {
          console.error("Error en /api/query:", e);
          setActive((prev) =>
            prev && prev.id === newId
              ? { ...pending, loading: false, error: e }
              : prev
          );
        }
      }, [query, active]);

      const handleLoadConv = useCallback((conv) => {
        // Cargar una conversación del historial es local — no llama al backend.
        setActive({ ...conv, loading: false });
        setQuery("");
      }, []);

      const handleNewConv = useCallback(() => {
        setActive(null);
        setQuery("");
      }, []);

      const handleDeleteConv = useCallback((id) => {
        setHistory((prev) => prev.filter((c) => c.id !== id));
        // Si la borrada estaba activa, regresar a welcome.
        setActive((prev) => (prev && prev.id === id ? null : prev));
      }, []);

      return (
        <div className="legis-layout">
          <Sidebar
            stats={stats}
            history={history}
            activeId={active ? active.id : null}
            onNewConv={handleNewConv}
            onLoadConv={handleLoadConv}
            onDeleteConv={handleDeleteConv}
          />
          <main className="legis-main">
            {active == null ? (
              <WelcomeView
                query={query}
                onChange={setQuery}
                onSubmit={handleSubmit}
                onChipPick={handleChipPick}
                loading={false}
              />
            ) : (
              <>
                <ConversationView
                  active={active}
                  hasHistory={history.length > 0}
                />
                <div className="legis-input-bar bottom">
                  <InputBar
                    query={query}
                    onChange={setQuery}
                    onSubmit={handleSubmit}
                    loading={active.loading || false}
                  />
                </div>
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
