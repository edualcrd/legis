<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legis — Asistente Laboral</title>
  <meta name="description" content="Asistente legal con IA para despachos laboralistas en México. El precedente exacto, en segundos.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Tema: fija data-theme antes de pintar para evitar parpadeo (FOUC).
       Clave compartida con la landing: localStorage 'legis_theme'. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("legis_theme");
        if (t !== "light" && t !== "dark") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <style>
    /* ============================================================
       TOKENS — tema claro (default) y oscuro "focus"
       ============================================================ */
    :root {
      --bg:            #FFFFFF;
      --bg-soft:       #FAFAFB;
      --surface:       #F5F5F7;
      --surface-2:     #FFFFFF;
      --surface-3:     #EEF0F4;

      --border:        #E3E6EB;
      --border-2:      #D4DCE5;

      --primary:       #185FA5;
      --primary-hover: #0C447C;
      --accent-strong: #0C447C;
      --primary-soft:  #E6F1FB;
      --primary-soft-2:#C9DEEF;

      --text:          #1A1A2E;
      --text-2:        #2A3340;
      --text-muted:    #5B6470;
      --text-faint:    #9CA3AF;

      --cite-bg:       #E6F1FB;
      --cite-text:     #0C447C;
      --cite-border:   #C9DEEF;

      --user-bubble-bg:   #185FA5;
      --user-bubble-text: #FFFFFF;

      --warn-bg:       #FAEEDA;
      --warn-text:     #633806;
      --warn-border:   #B45309;

      --ok:            #22A06B;

      --error-bg:      #FEE2E2;
      --error-border:  #FECACA;
      --error-accent:  #DC2626;
      --error-text:    #991B1B;

      --badge-alta-bg:   #EAF3DE; --badge-alta-text:  #27500A;
      --badge-media-bg:  #FEF3C7; --badge-media-text: #92400E;
      --badge-baja-bg:   #FEE2E2; --badge-baja-text:  #991B1B;

      --track:         #E6EDF5;
      --scrollbar:     #cdd5df;

      --shadow-input:        0 2px 12px rgba(15,30,60,0.06);
      --shadow-input-focus:  0 4px 18px rgba(24,95,165,0.16);
      --shadow-card:         0 1px 3px rgba(15,30,60,0.04);
      --shadow-pop:          0 12px 36px -10px rgba(15,30,60,0.18);

      --atmosphere: radial-gradient(820px 520px at 78% -8%, rgba(24,95,165,0.06), transparent 62%),
                    radial-gradient(640px 460px at 8% 6%, rgba(24,95,165,0.035), transparent 60%);

      --ease:     cubic-bezier(.2,.7,.2,1);
      --ease-out: cubic-bezier(.16,1,.3,1);
    }

    :root[data-theme="dark"] {
      --bg:            #0E1421;
      --bg-soft:       #131A28;
      --surface:       #18212F;
      --surface-2:     #1C2636;
      --surface-3:     #232E40;

      --border:        #2A3548;
      --border-2:      #364257;

      --primary:       #4D94D6;
      --primary-hover: #6BA9E0;
      --accent-strong: #9CC6EA;
      --primary-soft:  rgba(77,148,214,0.16);
      --primary-soft-2:rgba(77,148,214,0.32);

      --text:          #E6ECF3;
      --text-2:        #B9C2CF;
      --text-muted:    #8A95A5;
      --text-faint:    #5E6B7D;

      --cite-bg:       rgba(77,148,214,0.16);
      --cite-text:     #9CC6EA;
      --cite-border:   rgba(77,148,214,0.34);

      --user-bubble-bg:   #2C6FB0;
      --user-bubble-text: #F2F7FC;

      --warn-bg:       rgba(180,83,9,0.16);
      --warn-text:     #F0C892;
      --warn-border:   #D08A2E;

      --ok:            #34C988;

      --error-bg:      rgba(220,38,38,0.14);
      --error-border:  rgba(220,38,38,0.34);
      --error-accent:  #F87171;
      --error-text:    #FCA5A5;

      --badge-alta-bg:   rgba(52,201,136,0.16); --badge-alta-text:  #7EE0B0;
      --badge-media-bg:  rgba(217,164,6,0.18);  --badge-media-text: #F1C75A;
      --badge-baja-bg:   rgba(220,38,38,0.16);  --badge-baja-text:  #FCA5A5;

      --track:         #2A3548;
      --scrollbar:     #3a465c;

      --shadow-input:        0 2px 14px rgba(0,0,0,0.45);
      --shadow-input-focus:  0 6px 22px rgba(77,148,214,0.30);
      --shadow-card:         0 1px 3px rgba(0,0,0,0.35);
      --shadow-pop:          0 18px 44px -12px rgba(0,0,0,0.6);

      --atmosphere: radial-gradient(820px 520px at 78% -8%, rgba(77,148,214,0.14), transparent 62%),
                    radial-gradient(640px 460px at 8% 6%, rgba(77,148,214,0.08), transparent 60%);
    }

    /* === Reset y base === */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color .3s var(--ease), color .3s var(--ease);
    }
    /* Atmósfera muy sutil detrás de todo — theme-aware */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--atmosphere);
      transition: background .4s var(--ease);
    }
    .legis-layout { position: relative; z-index: 1; }
    button { font-family: inherit; cursor: pointer; }
    a { color: var(--primary); }
    code { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 0.9em; }

    /* Scrollbars theme-aware */
    .legis-sidebar, .legis-conversation, .legis-history-list, .legis-input-textarea {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar) transparent;
    }
    .legis-sidebar::-webkit-scrollbar,
    .legis-conversation::-webkit-scrollbar,
    .legis-history-list::-webkit-scrollbar,
    .legis-input-textarea::-webkit-scrollbar { width: 9px; height: 9px; }
    .legis-sidebar::-webkit-scrollbar-thumb,
    .legis-conversation::-webkit-scrollbar-thumb,
    .legis-history-list::-webkit-scrollbar-thumb,
    .legis-input-textarea::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .legis-sidebar::-webkit-scrollbar-track,
    .legis-conversation::-webkit-scrollbar-track { background: transparent; }

    /* === Layout principal — full viewport === */
    .legis-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .legis-sidebar {
      width: 270px;
      flex-shrink: 0;
      background: var(--surface);
      padding: 1.5rem 1.25rem;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      height: 100vh;
      transition: background-color .3s var(--ease), border-color .3s var(--ease);
    }
    .legis-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: transparent; /* deja ver la atmósfera de body::before */
      height: 100vh;
      overflow: hidden;
    }

    /* === Sidebar: header (logo + toggle de tema) === */
    .legis-sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .legis-logo {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .legis-logo-icon {
      font-size: 1.95rem;
      line-height: 1;
      color: var(--primary);
      display: inline-block;
      transform-origin: 50% 18%;
      animation: legis-scale-settle 1.1s var(--ease-out) both;
    }
    .legis-logo-name {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--accent-strong);
      letter-spacing: -0.01em;
      line-height: 1;
      transition: color .3s var(--ease);
    }
    .legis-tagline {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0.35rem 0 1.4rem 0;
    }

    /* Toggle de tema sol/luna */
    .legis-theme-toggle {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color .2s var(--ease), border-color .2s var(--ease),
                  color .2s var(--ease), transform .2s var(--ease);
    }
    .legis-theme-toggle:hover {
      color: var(--primary);
      border-color: var(--primary-soft-2);
      transform: translateY(-1px) rotate(-12deg);
    }
    .legis-theme-toggle:active { transform: scale(0.92); }
    .legis-theme-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .legis-theme-toggle svg { display: block; animation: legis-pop .35s var(--ease-out) both; }

    .legis-section-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 1.2rem 0 0.55rem 0;
    }

    /* === Stats: lista vertical === */
    .legis-stats {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .legis-stat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      transition: background-color .3s var(--ease), border-color .25s var(--ease), transform .18s var(--ease);
    }
    .legis-stat:hover { border-color: var(--primary-soft-2); transform: translateX(2px); }
    .legis-stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      min-width: 2.5ch;
      text-align: right;
      flex-shrink: 0;
      transition: color .3s var(--ease);
    }
    .legis-stat-label {
      font-size: 0.78rem;
      color: var(--text-2);
      line-height: 1.3;
      transition: color .3s var(--ease);
    }
    .legis-stat-placeholder { color: var(--text-faint) !important; }

    /* === Lista de fuentes activas === */
    .legis-sources-list { margin-top: 0.3rem; }
    .legis-source-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.3rem 0;
      font-size: 0.85rem;
      color: var(--text-2);
      line-height: 1.35;
      animation: legis-fade-right .5s var(--ease-out) both;
    }
    .legis-source-check {
      color: var(--ok);
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
      width: 1rem;
      text-align: center;
    }
    .legis-update-info {
      margin-top: 0.7rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* === Historial de conversaciones === */
    .legis-history-new {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: var(--surface-2);
      border: 1px solid var(--primary-soft-2);
      border-radius: 6px;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.55rem 0.75rem;
      margin: 0 0 0.6rem 0;
      font-family: inherit;
      transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease);
      cursor: pointer;
    }
    .legis-history-new:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .legis-history-new:active { transform: translateY(0); }
    .legis-history-empty {
      font-size: 0.75rem;
      color: var(--text-faint);
      font-style: italic;
      padding: 0.4rem 0;
      text-align: center;
    }
    .legis-history-list {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      max-height: 280px;
      overflow-y: auto;
    }
    .legis-history-item {
      display: flex;
      align-items: stretch;
      border-radius: 6px;
      transition: background-color .15s var(--ease);
      animation: legis-fade-up .4s var(--ease-out) both;
    }
    .legis-history-item:hover { background: var(--surface-3); }
    .legis-history-item.active { background: var(--primary-soft); }
    .legis-history-item.active .legis-history-preview {
      color: var(--accent-strong);
      font-weight: 500;
    }
    .legis-history-text {
      flex: 1;
      background: none;
      border: none;
      text-align: left;
      padding: 0.5rem 0.4rem 0.5rem 0.6rem;
      font-family: inherit;
      cursor: pointer;
      color: inherit;
      min-width: 0;
    }
    .legis-history-preview {
      font-size: 0.82rem;
      color: var(--text-2);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .legis-history-date {
      font-size: 0.7rem;
      color: var(--text-faint);
      margin-top: 0.18rem;
    }
    .legis-history-delete {
      background: none;
      border: none;
      color: var(--text-faint);
      padding: 0 0.55rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-radius: 0 6px 6px 0;
      transition: color .15s, background-color .15s;
      opacity: 0;
      flex-shrink: 0;
    }
    .legis-history-item:hover .legis-history-delete,
    .legis-history-item.active .legis-history-delete {
      opacity: 1;
    }
    .legis-history-delete:hover {
      color: var(--error-accent);
      background: rgba(220, 38, 38, 0.10);
    }

    /* === Caja advertencia ámbar === */
    .legis-warning {
      background: var(--warn-bg);
      color: var(--warn-text);
      padding: 0.8rem 0.9rem;
      border-radius: 6px;
      font-size: 0.76rem;
      line-height: 1.48;
      border-left: 3px solid var(--warn-border);
      margin-top: 1.6rem;
      transition: background-color .3s var(--ease), color .3s var(--ease);
    }
    .legis-warning-title {
      font-weight: 700;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.7rem;
    }

    /* === Welcome state (sin respuesta): centrado vertical === */
    .legis-welcome {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }
    .legis-welcome::before {
      content: "";
      position: absolute;
      top: 26%;
      left: 50%;
      width: min(560px, 80%);
      height: 320px;
      transform: translateX(-50%);
      background: radial-gradient(50% 50% at 50% 50%, var(--primary-soft), transparent 70%);
      opacity: 0.7;
      filter: blur(20px);
      z-index: 0;
      pointer-events: none;
    }
    .legis-welcome > * { position: relative; z-index: 1; }
    .legis-welcome-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-strong);
      text-align: center;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.01em;
      transition: color .3s var(--ease);
      animation: legis-fade-up .6s var(--ease-out) both;
    }
    .legis-welcome-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      text-align: center;
      margin: 0 0 2.25rem 0;
      animation: legis-fade-up .6s var(--ease-out) .09s both;
    }
    .legis-welcome .legis-input-bar { animation: legis-fade-up .6s var(--ease-out) .18s both; }

    /* === Conversation state === */
    .legis-conversation {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .legis-conversation-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* === Input bar === */
    .legis-input-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .legis-input-bar.bottom {
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem 1.5rem 1.5rem;
      background: var(--bg);
      transition: background-color .3s var(--ease), border-color .3s var(--ease);
    }
    .legis-input-bar.centered { padding: 0; }
    .legis-input-wrapper {
      position: relative;
      max-width: 760px;
      width: 100%;
    }
    .legis-input-textarea {
      width: 100%;
      padding: 1.05rem 3.75rem 1.05rem 1.35rem;
      border-radius: 24px;
      border: 1px solid var(--border-2);
      box-shadow: var(--shadow-input);
      resize: none;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.5;
      min-height: 56px;
      max-height: 200px;
      outline: none;
      transition: box-shadow 0.22s var(--ease), border-color 0.22s var(--ease),
                  background-color .3s var(--ease), color .3s var(--ease);
      color: var(--text);
      background: var(--surface-2);
      overflow-y: hidden;
    }
    .legis-input-textarea:focus {
      box-shadow: var(--shadow-input-focus);
      border-color: var(--primary);
    }
    .legis-input-textarea:disabled {
      background: var(--surface);
      color: var(--text-muted);
      cursor: not-allowed;
    }
    .legis-input-textarea::placeholder { color: var(--text-faint); }

    .legis-input-send {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 19px;
      background: var(--primary);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.18s var(--ease), transform 0.12s var(--ease), box-shadow .18s var(--ease);
    }
    .legis-input-send:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px -2px rgba(24,95,165,0.5);
    }
    .legis-input-send:hover:not(:disabled) svg { transform: translateY(-1px); }
    .legis-input-send:active:not(:disabled) { transform: translateY(-50%) scale(0.9); }
    .legis-input-send:disabled { background: var(--border-2); cursor: not-allowed; }
    .legis-input-send svg { display: block; transition: transform .18s var(--ease); }

    .legis-input-hint {
      margin-top: 0.55rem;
      font-size: 0.72rem;
      color: var(--text-faint);
      text-align: center;
    }

    /* === Chips centrados (welcome) === */
    .legis-chips-centered {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      margin-top: 1.4rem;
      max-width: 760px;
      width: 100%;
    }
    .legis-chip {
      position: relative;
      overflow: hidden;
      background: var(--surface-2);
      color: var(--accent-strong);
      border: 1px solid var(--primary-soft-2);
      border-radius: 999px;
      padding: 0.42rem 1rem;
      font-size: 0.84rem;
      font-weight: 500;
      transition: background-color .18s var(--ease), border-color .18s var(--ease),
                  color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
      line-height: 1.3;
      animation: legis-chip-in .5s var(--ease-out) both;
    }
    .legis-chip::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform .55s var(--ease);
    }
    .legis-chip:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -8px rgba(24,95,165,0.5);
    }
    .legis-chip:hover::after { transform: translateX(120%); }
    .legis-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .legis-chip:disabled { opacity: 0.6; cursor: not-allowed; }
    .legis-chip:nth-child(1) { animation-delay: .26s; }
    .legis-chip:nth-child(2) { animation-delay: .31s; }
    .legis-chip:nth-child(3) { animation-delay: .36s; }
    .legis-chip:nth-child(4) { animation-delay: .41s; }
    .legis-chip:nth-child(5) { animation-delay: .46s; }
    .legis-chip:nth-child(6) { animation-delay: .51s; }

    /* === Turno === */
    .legis-turn {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .legis-user-bubble {
      align-self: flex-end;
      max-width: 78%;
      background: var(--user-bubble-bg);
      color: var(--user-bubble-text);
      padding: 0.75rem 1.15rem;
      border-radius: 18px;
      border-bottom-right-radius: 5px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 3px rgba(24,95,165,0.18);
      transition: background-color .3s var(--ease);
      animation: legis-bubble-in .42s var(--ease-out) both;
    }

    /* === Loading turn — secuencia de procesamiento === */
    .legis-loading-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      color: var(--text-2);
      font-size: 0.92rem;
      align-self: stretch;
      box-shadow: var(--shadow-card);
      transition: background-color .3s var(--ease), border-color .3s var(--ease);
      animation: legis-fade-up .4s var(--ease-out) both;
    }
    .legis-proc { display: flex; flex-direction: column; gap: 0.7rem; }
    .legis-proc-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: var(--text-2);
      opacity: 0;
      transform: translateX(-8px);
      animation: legis-proc-row .5s var(--ease-out) forwards;
    }
    .legis-proc-row:nth-child(1) { animation-delay: .15s; }
    .legis-proc-row:nth-child(2) { animation-delay: .75s; }
    .legis-proc-row:nth-child(3) { animation-delay: 1.35s; }
    .legis-proc-spin {
      width: 16px;
      height: 16px;
      border: 2.5px solid var(--primary-soft-2);
      border-top-color: var(--primary);
      border-radius: 50%;
      flex-shrink: 0;
      animation: legis-spin 0.8s linear infinite;
    }
    .legis-loading-note {
      margin-top: 0.85rem;
      padding-top: 0.7rem;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* === Error turn === */
    .legis-error-card {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-left: 3px solid var(--error-accent);
      border-radius: 8px;
      padding: 0.95rem 1.2rem;
      color: var(--error-text);
      font-size: 0.92rem;
      line-height: 1.5;
      align-self: stretch;
      animation: legis-fade-up .4s var(--ease-out) both;
    }
    .legis-error-card code {
      background: rgba(0,0,0,0.10);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    /* === Card de respuesta === */
    .legis-answer-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.85rem 2rem;
      box-shadow: var(--shadow-card);
      font-size: 16px;
      line-height: 1.65;
      color: var(--text);
      align-self: stretch;
      transition: background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
      animation: legis-answer-in .55s var(--ease-out) both;
    }
    .legis-answer-body > h2,
    .legis-answer-card h2 {
      color: var(--accent-strong);
      font-size: 1.18rem;
      font-weight: 700;
      margin: 1.6rem 0 0.6rem 0;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.005em;
      transition: color .3s var(--ease);
    }
    .legis-answer-body > h2:first-child { margin-top: 0; }
    .legis-answer-card h3 {
      color: var(--primary);
      font-size: 1.02rem;
      font-weight: 600;
      margin: 1.1rem 0 0.45rem 0;
      transition: color .3s var(--ease);
    }
    .legis-answer-card p {
      margin: 0.85rem 0;
      font-size: 16px;
      line-height: 1.7;
    }
    .legis-answer-card ul, .legis-answer-card ol {
      padding-left: 1.5rem;
      margin: 0.75rem 0;
    }
    .legis-answer-card li {
      margin: 0.45rem 0;
      font-size: 16px;
      line-height: 1.65;
    }
    .legis-answer-card strong { font-weight: 600; color: var(--accent-strong); transition: color .3s var(--ease); }
    .legis-answer-card hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.3rem 0;
    }

    /* Revelado escalonado de los bloques de la respuesta */
    .legis-answer-body > * { animation: legis-fade-up .5s var(--ease-out) both; }
    .legis-answer-body > *:nth-child(1)  { animation-delay: .04s; }
    .legis-answer-body > *:nth-child(2)  { animation-delay: .10s; }
    .legis-answer-body > *:nth-child(3)  { animation-delay: .16s; }
    .legis-answer-body > *:nth-child(4)  { animation-delay: .22s; }
    .legis-answer-body > *:nth-child(5)  { animation-delay: .28s; }
    .legis-answer-body > *:nth-child(6)  { animation-delay: .34s; }
    .legis-answer-body > *:nth-child(7)  { animation-delay: .40s; }
    .legis-answer-body > *:nth-child(8)  { animation-delay: .46s; }
    .legis-answer-body > *:nth-child(9)  { animation-delay: .52s; }
    .legis-answer-body > *:nth-child(10) { animation-delay: .58s; }
    .legis-answer-body > *:nth-child(11) { animation-delay: .62s; }
    .legis-answer-body > *:nth-child(12) { animation-delay: .66s; }

    /* === Confianza inline === */
    .legis-confidence-inline {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.15rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .legis-conf-inline-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .legis-conf-inline-bar {
      flex: 1;
      min-width: 100px;
      max-width: 220px;
      height: 6px;
      background: var(--track);
      border-radius: 3px;
      overflow: hidden;
    }
    .legis-conf-inline-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-hover));
      border-radius: 3px;
      transition: width 0.7s var(--ease-out);
    }
    .legis-conf-inline-badge {
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .legis-conf-inline-badge.alta  { background: var(--badge-alta-bg);  color: var(--badge-alta-text); }
    .legis-conf-inline-badge.media { background: var(--badge-media-bg); color: var(--badge-media-text); }
    .legis-conf-inline-badge.baja  { background: var(--badge-baja-bg);  color: var(--badge-baja-text); }
    .legis-conf-inline-pct {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* === Citación inline === */
    .legis-cite {
      background: var(--cite-bg);
      color: var(--cite-text);
      padding: 0.18rem 0.6rem;
      border-radius: 5px;
      font-size: 0.92em;
      font-weight: 500;
      border: 1px solid var(--cite-border);
      white-space: nowrap;
      margin: 0 2px;
      display: inline-block;
      line-height: 1.4;
      transition: background-color .15s var(--ease), transform .14s var(--ease), box-shadow .15s var(--ease);
      animation: legis-cite-in .45s var(--ease-out) .35s both;
    }
    .legis-cite:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px -4px rgba(24,95,165,0.45);
    }

    /* === Acordeón de fuentes === */
    .legis-sources-accordion {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .legis-accordion-toggle {
      background: none;
      border: none;
      padding: 0.4rem 0;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
      transition: color .15s;
    }
    .legis-accordion-toggle:hover { color: var(--primary-hover); }
    .legis-accordion-toggle svg { transition: transform 0.25s var(--ease); }
    .legis-accordion-toggle.open svg { transform: rotate(90deg); }
    .legis-accordion-content {
      margin-top: 0.95rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    @media (max-width: 600px) {
      .legis-accordion-content { grid-template-columns: 1fr; }
    }

    /* Source card */
    .legis-source-card {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      transition: background-color .3s var(--ease), border-color .2s var(--ease), transform .18s var(--ease);
      animation: legis-fade-up .45s var(--ease-out) both;
    }
    .legis-source-card:hover { border-color: var(--primary-soft-2); transform: translateY(-2px); }
    .legis-source-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }
    .legis-source-cite {
      color: var(--accent-strong);
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-word;
      line-height: 1.35;
      transition: color .3s var(--ease);
    }
    .legis-badge {
      padding: 0.14rem 0.55rem;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .legis-badge.obligatoria { background: var(--badge-alta-bg);  color: var(--badge-alta-text); }
    .legis-badge.orientadora { background: var(--badge-media-bg); color: var(--badge-media-text); }
    .legis-source-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .legis-source-meta .pipe { margin: 0 0.4rem; color: var(--border-2); }
    .legis-source-relevance {
      margin-top: 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .legis-source-relevance-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      flex-shrink: 0;
    }
    .legis-source-relevance-bar {
      flex: 1;
      height: 4px;
      background: var(--track);
      border-radius: 2px;
      overflow: hidden;
    }
    .legis-source-relevance-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.6s var(--ease-out);
    }

    /* ============================================================
       KEYFRAMES
       ============================================================ */
    @keyframes legis-spin { to { transform: rotate(360deg); } }
    @keyframes legis-fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes legis-fade-right {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes legis-answer-in {
      from { opacity: 0; transform: translateY(14px) scale(0.995); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes legis-bubble-in {
      from { opacity: 0; transform: translateY(6px) translateX(12px); }
      to   { opacity: 1; transform: translateY(0) translateX(0); }
    }
    @keyframes legis-chip-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes legis-cite-in {
      0%   { opacity: 0; transform: scale(0.85); }
      60%  { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes legis-pop {
      0%   { opacity: 0; transform: scale(0.6) rotate(-20deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes legis-proc-row {
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes legis-scale-settle {
      0%   { opacity: 0; transform: scale(0.6) rotate(-8deg); }
      55%  { opacity: 1; transform: scale(1.12) rotate(3deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .legis-layout {
        flex-direction: column;
        height: auto;
        overflow: visible;
      }
      .legis-sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 1.25rem;
      }
      .legis-main { height: auto; }
      .legis-conversation { padding: 1.25rem; }
      .legis-answer-card { padding: 1.5rem 1.4rem; }
      .legis-welcome-title { font-size: 1.55rem; }
      .legis-input-bar.bottom { padding: 0.8rem 1rem 1rem 1rem; }
    }

    /* === Accesibilidad: reducir movimiento === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.5/babel.min.js"></script>
  <script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>

  <script type="text/babel">
    "use strict";

    const { useState, useEffect, useCallback, useRef, useLayoutEffect } = React;

    // === Constantes ===

    const EXAMPLE_CHIPS = [
      "¿Cómo calcular la liquidación?",
      "¿Procede la reinstalación?",
      "Contratos por tiempo determinado",
      "Límite de horas extra",
      "Despido injustificado outsourcing",
    ];

    const DOC_TYPE_ES = {
      ley_federal: "ley federal",
      constitucion: "constitución",
      jurisprudencia: "jurisprudencia",
      tesis: "tesis aislada",
      criterio_imss: "criterio IMSS",
      laudo: "laudo",
    };

    // Pasos del pipeline RAG mostrados durante la espera. Reflejan las etapas
    // reales de src/rag.py (expansión, recuperación, reranking).
    const PROC_STEPS = [
      "Expandiendo la consulta en términos jurídicos…",
      "Recuperando de la LFT, CPEUM y tesis de la SCJN…",
      "Re-ranqueando con el cross-encoder…",
    ];

    const VIGENCIA_ANYO = new Date().getFullYear();
    const TODAY_ES = new Date().toLocaleDateString("es-MX", {
      day: "numeric",
      month: "long",
      year: "numeric",
    });

    const CITATION_REGEX = /\[(?:LFT|LSS|LFTSE|LINFONAVIT|CPEUM|SCJN|IMSS|STPS)\b[^\]]*\]/g;

    const HISTORY_STORAGE_KEY = "legis_history_v1";
    const THEME_STORAGE_KEY = "legis_theme";
    const SESSION_STORAGE_KEY = "legis_session";
    const HISTORY_MAX = 20;
    const QUERY_PREVIEW_MAX = 40;

    // === Sesión (magic link) ===

    /** Lee la sesión de localStorage: { email, authenticated, token } o null. */
    function loadSession() {
      try {
        const raw = localStorage.getItem(SESSION_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.authenticated && parsed.token) return parsed;
        return null;
      } catch (e) {
        console.warn("No se pudo leer la sesión:", e);
        return null;
      }
    }

    /** Persiste la sesión; silencioso si localStorage no está disponible. */
    function saveSession(session) {
      try {
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
      } catch (e) {
        console.warn("No se pudo guardar la sesión:", e);
      }
    }

    /** Borra la sesión (cerrar sesión). */
    function clearSession() {
      try {
        localStorage.removeItem(SESSION_STORAGE_KEY);
      } catch (e) {
        console.warn("No se pudo borrar la sesión:", e);
      }
    }

    // === Helpers ===

    function confidenceDescriptor(value) {
      if (value >= 0.95) return { label: "Alta", cssClass: "alta" };
      if (value >= 0.5) return { label: "Media", cssClass: "media" };
      return { label: "Baja", cssClass: "baja" };
    }

    function scoreToPercent(score) {
      if (typeof score !== "number" || isNaN(score)) return 0;
      const sig = 1 / (1 + Math.exp(-score));
      return Math.round(sig * 100);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function renderAnswerHtml(markdownText) {
      const html = marked.parse(markdownText || "", { breaks: true, gfm: true });
      return html.replace(CITATION_REGEX, (match) =>
        `<span class="legis-cite">${escapeHtml(match)}</span>`
      );
    }

    function formatSourcesList(stats) {
      if (!stats || !Array.isArray(stats.sources)) return [];
      const set = new Set(stats.sources);
      const items = [];
      if (set.has("LFT")) items.push(`Ley Federal del Trabajo (${VIGENCIA_ANYO})`);
      if (set.has("CPEUM")) items.push("Constitución — Art. 123");
      if (set.has("LSS")) items.push(`Ley del Seguro Social (${VIGENCIA_ANYO})`);
      if (set.has("LFTSE")) items.push(`LFTSE (${VIGENCIA_ANYO})`);
      if (set.has("LINFONAVIT")) items.push(`Ley del INFONAVIT (${VIGENCIA_ANYO})`);
      if (set.has("IMSS")) items.push(`Criterios normativos IMSS (${VIGENCIA_ANYO})`);
      if (set.has("SCJN")) {
        const total = (stats.juris || 0) + (stats.tesis || 0);
        items.push(`${total.toLocaleString("es-MX")} tesis laborales SCJN`);
      }
      if (set.has("STPS")) items.push("Normativa STPS");
      return items;
    }

    /**
     * Formato compacto para fechas del historial:
     *   Hoy        → "14:32"
     *   Ayer       → "Ayer"
     *   Esta semana → "Hace N días"
     *   Mismo año  → "12 may"
     *   Otro año   → "12 may 2024"
     */
    function formatDateShort(timestamp) {
      if (!timestamp) return "";
      const date = new Date(timestamp);
      const now = new Date();
      if (date.toDateString() === now.toDateString()) {
        return date.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMs = now.getTime() - date.getTime();
      const diffDays = Math.floor(diffMs / 86400000);
      if (diffDays === 1) return "Ayer";
      if (diffDays > 1 && diffDays < 7) return `Hace ${diffDays} días`;
      if (date.getFullYear() === now.getFullYear()) {
        return date.toLocaleDateString("es-MX", { day: "numeric", month: "short" });
      }
      return date.toLocaleDateString("es-MX", {
        day: "numeric", month: "short", year: "numeric",
      });
    }

    function previewQuery(text) {
      if (!text) return "";
      const t = text.trim();
      return t.length > QUERY_PREVIEW_MAX
        ? t.substring(0, QUERY_PREVIEW_MAX).trim() + "…"
        : t;
    }

    /** Carga el historial de localStorage, tolerante a corrupción/vacío. */
    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.warn("No se pudo cargar el historial:", e);
        return [];
      }
    }

    /** Persiste el historial; silencioso si localStorage no está disponible. */
    function saveHistory(history) {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
      } catch (e) {
        console.warn("No se pudo guardar el historial:", e);
      }
    }

    async function fetchJson(url, options) {
      const opts = { ...(options || {}) };
      // Adjunta el JWT de sesión si existe (lo exige /api/query). Es inofensivo
      // en endpoints públicos como /api/stats, que ignoran el header.
      const session = loadSession();
      if (session && session.token) {
        opts.headers = {
          ...(opts.headers || {}),
          Authorization: `Bearer ${session.token}`,
        };
      }
      const resp = await fetch(url, opts);
      const text = await resp.text();
      let body;
      try { body = text ? JSON.parse(text) : {}; }
      catch (e) { body = { detail: text || "Respuesta no parseable" }; }
      if (!resp.ok) {
        const err = new Error(body.detail || `HTTP ${resp.status}`);
        err.status = resp.status;
        err.body = body;
        throw err;
      }
      return body;
    }

    // === Hooks de animación ===

    /** Detecta la preferencia "reducir movimiento" y reacciona a cambios. */
    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(() => {
        try {
          return window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) { return false; }
      });
      useEffect(() => {
        if (!window.matchMedia) return;
        const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        const onChange = () => setReduced(mq.matches);
        if (mq.addEventListener) mq.addEventListener("change", onChange);
        return () => { if (mq.removeEventListener) mq.removeEventListener("change", onChange); };
      }, []);
      return reduced;
    }

    /**
     * Anima un número de 0 → target con easing (easeOutCubic) vía rAF.
     * Si target es null o se respeta reduced-motion, devuelve el valor final.
     */
    function useCountUp(target, duration = 900) {
      const reduced = usePrefersReducedMotion();
      const [val, setVal] = useState(0);
      useEffect(() => {
        if (target == null) { setVal(0); return; }
        if (reduced || duration <= 0) { setVal(target); return; }
        let raf, start = null;
        const step = (ts) => {
          if (start === null) start = ts;
          const p = Math.min(1, (ts - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          setVal(Math.round(target * eased));
          if (p < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [target, reduced, duration]);
      return target == null ? null : val;
    }

    /**
     * Devuelve un ancho que pasa de 0 → target tras montar, para que la
     * barra (con `transition: width`) anime el llenado. Respeta reduced-motion.
     */
    function useAnimatedWidth(target, delay = 60) {
      const reduced = usePrefersReducedMotion();
      const [w, setW] = useState(0);
      useEffect(() => {
        if (reduced) { setW(target); return; }
        const t = setTimeout(() => setW(target), delay);
        return () => clearTimeout(t);
      }, [target, reduced, delay]);
      return w;
    }

    /** Estado del tema (claro/oscuro) sincronizado con <html data-theme> y localStorage. */
    function useTheme() {
      const [theme, setTheme] = useState(() =>
        document.documentElement.dataset.theme === "dark" ? "dark" : "light"
      );
      const toggle = useCallback(() => {
        setTheme((prev) => {
          const next = prev === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem(THEME_STORAGE_KEY, next); }
          catch (e) { /* localStorage no disponible: solo aplica en memoria */ }
          return next;
        });
      }, []);
      return [theme, toggle];
    }

    // === Input (común a welcome y conversation) ===

    function InputBar({ query, onChange, onSubmit, loading, autoFocus }) {
      const ref = useRef(null);

      // Auto-grow del textarea hasta max-height. El scrollbar se oculta
      // mientras el contenido cabe; aparece solo si supera el tope, para
      // que el usuario pueda navegar texto muy largo sin perder visibilidad.
      useLayoutEffect(() => {
        const ta = ref.current;
        if (!ta) return;
        const MAX_H = 200;
        ta.style.height = "auto";
        const fullH = ta.scrollHeight;
        const next = Math.min(fullH, MAX_H);
        ta.style.height = next + "px";
        ta.style.overflowY = fullH > MAX_H ? "auto" : "hidden";
      }, [query]);

      useEffect(() => {
        if (autoFocus && ref.current) ref.current.focus();
      }, [autoFocus]);

      const handleKey = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (!loading && query.trim()) onSubmit();
        }
      };

      const disabled = loading || !query.trim();

      return (
        <div className="legis-input-wrapper">
          <textarea
            ref={ref}
            className="legis-input-textarea"
            placeholder="Pregunta sobre derecho laboral mexicano..."
            value={query}

            disabled={loading}

            disabled={disabled}

    /** Pantalla de login: pide acceso con el correo (magic link). */
    function LoginView({ theme, onToggleTheme, notice }) {
      const [email, setEmail] = useState("");
      // idle | sending | sent | error
      const [status, setStatus] = useState("idle");
      const [message, setMessage] = useState(null);

      const submit = useCallback(
        async (e) => {
          if (e) e.preventDefault();
          const trimmed = email.trim();
          if (!trimmed || status === "sending") return;
          setStatus("sending");
          setMessage(null);
          try {
            const data = await fetchJson("/api/auth/request-access", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: trimmed }),
            });
            setStatus("sent");
            setMessage(
              data.message ||
                "Si tu correo está autorizado, recibirás un enlace de acceso en breve."
            );
          } catch (err) {
            console.error("Error en request-access:", err);
            setStatus("error");
            setMessage(
              err.message || "No se pudo enviar la solicitud. Intenta de nuevo."
            );
          }
        },
        [email, status]
      );

      const inputStyle = {
        width: "100%",
        padding: "0.7rem 0.85rem",
        fontSize: "0.95rem",
        borderRadius: "10px",
        border: "1px solid var(--border, rgba(0,0,0,0.15))",
        background: "var(--bg)",
        color: "var(--text)",
        boxSizing: "border-box",
        marginBottom: "0.85rem",
      };

        width: "100%",
        padding: "0.7rem",
        fontSize: "0.95rem",
        fontWeight: 600,
        borderRadius: "10px",
        border: "none",
        cursor: status === "sending" ? "default" : "pointer",
        background: "var(--primary, #185FA5)",
        color: "#fff",
        opacity: status === "sending" ? 0.7 : 1,
      };

      return (
        <AuthShell theme={theme} onToggleTheme={onToggleTheme}>
          {notice && (
            <div
              style={{
                background: "rgba(217, 119, 6, 0.12)",
                border: "1px solid rgba(217, 119, 6, 0.4)",
                color: "var(--text)",

                padding: "0.6rem 0.8rem",
                fontSize: "0.83rem",
                marginBottom: "1rem",

              {notice}
            </div>
          )}

          {status === "sent" ? (
            <div style={{ textAlign: "center" }}>
              <div
                style={{
                  fontSize: "0.92rem",
                  color: "var(--text)",
                  marginBottom: "0.5rem",

              </div>
              <div style={{ fontSize: "0.8rem", color: "var(--text-muted, #6B7280)" }}>
                Revisa tu correo y abre el enlace para entrar.
              </div>
            </div>
          ) : (
            <form onSubmit={submit}>
              <label
                htmlFor="login-email"
                style={{
                  display: "block",
                  fontSize: "0.85rem",
                  fontWeight: 600,
                  marginBottom: "0.4rem",
                }}
              >
                Correo electrónico
              </label>
              <input
                id="login-email"
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="tucorreo@despacho.mx"
                autoFocus
                autoComplete="email"
                style={inputStyle}
              />
              <button type="submit" disabled={status === "sending"} style={buttonStyle}>
                {status === "sending" ? "Enviando…" : "Solicitar acceso"}
              </button>
              {status === "error" && message && (
                <div
                  style={{
                    marginTop: "0.75rem",
                    fontSize: "0.83rem",
                    color: "#DC2626",
                    textAlign: "center",
                  }}
                >
                  {message}
                </div>
              )}
              <div
                style={{
                  marginTop: "1rem",
                  fontSize: "0.78rem",
                  color: "var(--text-muted, #6B7280)",
                  textAlign: "center",
                }}
              >
                Acceso solo por invitación. Te enviaremos un enlace de un solo uso.
              </div>
            </form>
          )}
        </AuthShell>
      );
    }

    // === App raíz ===

    function App() {
      const [theme, toggleTheme] = useTheme();
      const [session, setSession] = useState(() => loadSession());
      // Modo de auth: null = normal; "verifying" mientras se valida el ?token
      // del magic link; "invalid" si la verificación falló.
      const [authView, setAuthView] = useState(() =>
        new URLSearchParams(window.location.search).get("token") ? "verifying" : null
      );
      const [authError, setAuthError] = useState(null);
      const [stats, setStats] = useState(null);
      const [query, setQuery] = useState("");
      // `active` es la conversación actualmente visible (puede estar loading,
      // tener resultado, o tener error). Null = vista welcome.
      const [active, setActive] = useState(null);
      // `history` se hidrata desde localStorage en la primera evaluación.
      const [history, setHistory] = useState(() => loadHistory());

      // Persistir historial automáticamente en cada cambio.
      useEffect(() => {
        saveHistory(history);
      }, [history]);

      // Stats del corpus (una sola vez al montar).
      useEffect(() => {
        fetchJson("/api/stats")
          .then(setStats)
          .catch((e) => {
            console.error("Error al cargar stats:", e);
            setStats({ chunks: 0, documents: 0, juris: 0, tesis: 0, sources: [] });
          });
      }, []);

      // Verificación del magic link: si la URL trae ?token, validarlo una vez.
      // En éxito guarda la sesión y entra a la app; en fallo muestra el login
      // con el motivo. Limpia el token de la URL pase lo que pase.
      useEffect(() => {
        const token = new URLSearchParams(window.location.search).get("token");
        if (!token) return;
        let cancelled = false;
        fetchJson(`/api/auth/verify?token=${encodeURIComponent(token)}`)
          .then((data) => {
            if (cancelled) return;
            window.history.replaceState({}, document.title, window.location.pathname);
            if (data.valid && data.session_token) {
              const sess = {
                email: data.email,
                authenticated: true,
                token: data.session_token,
              };
              saveSession(sess);
              setSession(sess);
              setAuthView(null);
            } else {
              setAuthError(data.reason || "El enlace no es válido o expiró.");
              setAuthView("invalid");
            }
          })
          .catch((e) => {
            if (cancelled) return;
            window.history.replaceState({}, document.title, window.location.pathname);
            setAuthError(e.message || "No se pudo verificar el enlace.");
            setAuthView("invalid");
          });
        return () => { cancelled = true; };
      }, []);

      const handleChipPick = useCallback((chip) => {
        setQuery(chip);
      }, []);

      const handleSubmit = useCallback(async () => {
        const trimmed = query.trim();
        if (!trimmed) return;
        if (active && active.loading) return;

        const newId = Date.now();
        const pending = {
          id: newId,
          query: trimmed,
          timestamp: newId,
          loading: true,
        };
        setActive(pending);
        setQuery("");

        try {
          const data = await fetchJson("/api/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: trimmed }),
          });
          const completed = {
            id: newId,
            query: trimmed,
            timestamp: newId,
            answer: data.answer,
            sources: data.sources,
            confidence: data.confidence,
            loading: false,
          };
          // Solo actualiza la vista si el usuario sigue en esta conversación
          // (puede haber cambiado a otra del historial mientras esperábamos).
          setActive((prev) => (prev && prev.id === newId ? completed : prev));
          // El guardado en historial sucede pase lo que pase con la vista —
          // el usuario debe poder recuperarlo desde el sidebar.
          setHistory((prev) => {
            const filtered = prev.filter((c) => c.id !== newId);
            return [completed, ...filtered].slice(0, HISTORY_MAX);
          });
        } catch (e) {
          console.error("Error en /api/query:", e);
          // Sesión expirada/ inválida: cerrar sesión y volver al login.
          if (e.status === 401) {
            clearSession();
            setSession(null);
            setActive(null);
            return;
          }
          setActive((prev) =>
            prev && prev.id === newId
              ? { ...pending, loading: false, error: e }
              : prev
          );
        }
      }, [query, active]);

      const handleLogout = useCallback(() => {
        clearSession();
        setSession(null);
        setActive(null);
      }, []);

      const handleLoadConv = useCallback((conv) => {
        // Cargar una conversación del historial es local — no llama al backend.
        setActive({ ...conv, loading: false });
        setQuery("");
      }, []);

      const handleNewConv = useCallback(() => {
        setActive(null);
        setQuery("");
      }, []);

      const handleDeleteConv = useCallback((id) => {
        setHistory((prev) => prev.filter((c) => c.id !== id));
        // Si la borrada estaba activa, regresar a welcome.
        setActive((prev) => (prev && prev.id === id ? null : prev));
      }, []);

      // Puerta de autenticación: verificando token → login → app.
      if (authView === "verifying") {
        return <AuthVerifying theme={theme} onToggleTheme={toggleTheme} />;
      }
      if (!session) {
        return (
          <LoginView
            theme={theme}
            onToggleTheme={toggleTheme}
            notice={authView === "invalid" ? authError : null}
          />
        );
      }

      return (
        <div className="legis-layout">
          <Sidebar
            stats={stats}
            history={history}
            activeId={active ? active.id : null}
            theme={theme}
            onToggleTheme={toggleTheme}
            onNewConv={handleNewConv}
            onLoadConv={handleLoadConv}
            onDeleteConv={handleDeleteConv}
            userEmail={session.email}
            onLogout={handleLogout}
          />
          <main className="legis-main">
            {active == null ? (
              <WelcomeView
                query={query}
                onChange={setQuery}
                onSubmit={handleSubmit}
                onChipPick={handleChipPick}
                loading={false}
              />
            ) : (
              <>
                <ConversationView
                  active={active}
                  hasHistory={history.length > 0}
                />
                <div className="legis-input-bar bottom">
                  <InputBar
                    query={query}
                    onChange={setQuery}
                    onSubmit={handleSubmit}
                    loading={active.loading || false}
                  />
                </div>
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
